<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Knowledge Hub - Dành cho bạn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel để dịch JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Cấu hình Tailwind cho Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.7);
        }
    </style>
</head>
<body class="transition-colors duration-300 bg-slate-50 dark:bg-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (SVG Components) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );

        const Icons = {
            Search: (props) => <Icon {...props} path={<React.Fragment><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></React.Fragment>} />,
            BookOpen: (props) => <Icon {...props} path={<React.Fragment><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></React.Fragment>} />,
            Code: (props) => <Icon {...props} path={<React.Fragment><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></React.Fragment>} />,
            Database: (props) => <Icon {...props} path={<React.Fragment><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></React.Fragment>} />,
            Server: (props) => <Icon {...props} path={<React.Fragment><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></React.Fragment>} />,
            Terminal: (props) => <Icon {...props} path={<React.Fragment><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></React.Fragment>} />,
            Moon: (props) => <Icon {...props} path={<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>} />,
            Sun: (props) => <Icon {...props} path={<React.Fragment><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></React.Fragment>} />,
            Plus: (props) => <Icon {...props} path={<React.Fragment><path d="M5 12h14"/><path d="M12 5v14"/></React.Fragment>} />,
            X: (props) => <Icon {...props} path={<React.Fragment><path d="M18 6 6 18"/><path d="m6 6 12 12"/></React.Fragment>} />,
            ChevronRight: (props) => <Icon {...props} path={<path d="m9 18 6-6-6-6"/>} />,
            Cpu: (props) => <Icon {...props} path={<React.Fragment><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></React.Fragment>} />,
            Layout: (props) => <Icon {...props} path={<React.Fragment><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></React.Fragment>} />,
            ExternalLink: (props) => <Icon {...props} path={<React.Fragment><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></React.Fragment>} />,
            Refresh: (props) => <Icon {...props} path={<React.Fragment><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></React.Fragment>} />
        };

        // --- DỮ LIỆU GỐC ---
        const initialKnowledge = [
            { id: 1, title: "React Hooks Cơ Bản", category: "Frontend", summary: "Tìm hiểu về useState, useEffect và cách quản lý state.", content: "React Hooks là các hàm cho phép bạn 'kết nối' vào state và vòng đời của React từ các functional components. useState giúp khai báo state, useEffect xử lý side effects như gọi API...", date: "2023-10-25", author: "Người tạo", link: "https://react.dev/" },
            { id: 2, title: "Docker cho người mới", category: "DevOps", summary: "Container hóa ứng dụng là gì? Dockerfile đơn giản.", content: "Docker giúp đóng gói ứng dụng và các dependencies vào một container, đảm bảo ứng dụng chạy giống nhau trên mọi môi trường. Các lệnh cơ bản: docker build, docker run...", date: "2023-11-02", author: "Admin", link: "https://www.docker.com/" },
            { id: 3, title: "SQL Indexing", category: "Database", summary: "Tối ưu hóa truy vấn cơ sở dữ liệu với Index.", content: "Index giống như mục lục của một cuốn sách. Nó giúp database tìm kiếm dữ liệu nhanh hơn mà không cần quét toàn bộ bảng. Tuy nhiên, quá nhiều index sẽ làm chậm thao tác ghi...", date: "2023-11-10", author: "DBA Pro", link: "https://use-the-index-luke.com/" },
            { id: 4, title: "RESTful API Design", category: "Backend", summary: "Nguyên tắc thiết kế API: Resource, Methods, Status.", content: "REST sử dụng các phương thức HTTP chuẩn: GET, POST, PUT, DELETE. Cần chú ý sử dụng đúng HTTP Status Codes như 200 (OK), 201 (Created), 400 (Bad Request), 404 (Not Found)...", date: "2023-11-15", author: "Backend Dev", link: "https://restfulapi.net/" },
            { id: 5, title: "CSS Flexbox", category: "Frontend", summary: "Căn chỉnh layout dễ dàng với Flexbox.", content: "Flexbox là module layout một chiều. Container cha sử dụng `display: flex`. Các thuộc tính quan trọng: `justify-content` (trục chính), `align-items` (trục chéo)...", date: "2023-11-20", author: "UI Designer", link: "https://css-tricks.com/snippets/css/a-guide-to-flexbox/" },
            { id: 6, title: "Git Commands", category: "DevOps", summary: "Tổng hợp lệnh Git: commit, push, merge.", content: "Git là hệ thống quản lý phiên bản. Lệnh thường dùng: `git status`, `git add .`, `git commit -m 'msg'`, `git push`...", date: "2023-12-01", author: "Dev", link: "https://git-scm.com/doc" },
            { id: 7, title: "HTML Cơ bản & Thẻ Semantic", category: "Frontend", summary: "Cấu trúc trang web và cách sử dụng các thẻ có ý nghĩa (header, nav, section, footer).", content: "HTML là ngôn ngữ đánh dấu siêu văn bản. Semantic HTML giúp công cụ tìm kiếm và trình đọc màn hình hiểu rõ nội dung trang web hơn.", date: "2024-01-05", author: "Sưu tầm", link: "https://www.w3schools.com/html/" },
            { id: 8, title: "Biến trong JavaScript", category: "Frontend", summary: "Phân biệt phạm vi (scope) của var, let, const.", content: "Var có function scope, trong khi Let và Const có block scope. Const dùng cho hằng số không thay đổi giá trị.", date: "2024-01-06", author: "Sưu tầm", link: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var" },
            { id: 9, title: "Thuật toán Sắp xếp", category: "General", summary: "Bubble Sort, Merge Sort, Quick Sort và độ phức tạp thời gian.", content: "Sắp xếp là bài toán cơ bản trong KHMT. Quick Sort thường nhanh nhất trong thực tế (O(n log n)), Bubble Sort chậm nhất (O(n^2)).", date: "2024-01-08", author: "Sưu tầm", link: "https://www.geeksforgeeks.org/sorting-algorithms/" },
            { id: 10, title: "ReactJS Component", category: "Frontend", summary: "Function vs Class Component, State và Props.", content: "Component là khối xây dựng cơ bản của React. Props truyền dữ liệu từ cha xuống con, State quản lý dữ liệu nội bộ.", date: "2024-01-10", author: "Sưu tầm", link: "https://react.dev/learn/your-first-component" },
            { id: 11, title: "Câu lệnh SQL cơ bản (CRUD)", category: "Database", summary: "SELECT, INSERT, UPDATE, DELETE.", content: "CRUD là 4 thao tác cơ bản với dữ liệu. Cẩn thận với DELETE và UPDATE nếu thiếu mệnh đề WHERE!", date: "2024-01-12", author: "DB Admin", link: "https://www.w3schools.com/sql/" },
            { id: 12, title: "Lập trình Hướng đối tượng (OOP)", category: "General", summary: "4 trụ cột: Kế thừa, Đa hình, Trừu tượng, Đóng gói.", content: "OOP giúp mô hình hóa phần mềm theo các đối tượng thực tế. Giúp code dễ bảo trì và tái sử dụng.", date: "2024-01-15", author: "Pro Coder", link: "https://www.geeksforgeeks.org/object-oriented-programming-oops-concept-in-java/" },
            { id: 13, title: "Con trỏ (Pointers) C++", category: "General", summary: "Thao tác trực tiếp với địa chỉ bộ nhớ.", content: "Con trỏ lưu trữ địa chỉ bộ nhớ của biến khác. Rất mạnh mẽ nhưng dễ gây lỗi (memory leak, segmentation fault).", date: "2024-01-18", author: "C++ Dev", link: "https://www.geeksforgeeks.org/pointers-in-c-cpp/" },
            { id: 14, title: "Quản lý Bộ nhớ C++", category: "General", summary: "Stack vs Heap, new và delete.", content: "Stack tự động giải phóng, Heap cần quản lý thủ công. Quên delete sẽ gây rò rỉ bộ nhớ.", date: "2024-01-20", author: "C++ Dev", link: "https://www.geeksforgeeks.org/dynamic-memory-allocation-in-c/" },
            { id: 15, title: "Template trong C++", category: "General", summary: "Lập trình tổng quát (Generic Programming).", content: "Template cho phép viết hàm/lớp làm việc với nhiều kiểu dữ liệu mà không cần viết lại code.", date: "2024-01-22", author: "C++ Dev", link: "https://www.w3schools.com/cpp/cpp_templates.asp" },
            { id: 16, title: "LINQ trong C#", category: "Backend", summary: "Truy vấn dữ liệu thống nhất (Language Integrated Query).", content: "LINQ giúp viết câu truy vấn dữ liệu trên Array, List, SQL, XML bằng cú pháp giống SQL ngay trong C#.", date: "2024-02-01", author: ".NET Dev", link: "https://learn.microsoft.com/en-us/dotnet/csharp/linq/" },
            { id: 17, title: "Kiểu Dữ liệu Nullable C#", category: "Backend", summary: "Xử lý giá trị null an toàn.", content: "Giúp tránh lỗi NullReferenceException bằng cách cho phép biến kiểu giá trị (int, bool) chứa giá trị null.", date: "2024-02-03", author: ".NET Dev", link: "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/nullable-value-types" },
            { id: 18, title: "Async/Await trong C#", category: "Backend", summary: "Lập trình bất đồng bộ (Asynchronous).", content: "Giúp ứng dụng không bị 'đơ' (block UI) khi thực hiện tác vụ nặng như gọi API, đọc file.", date: "2024-02-05", author: ".NET Dev", link: "https://learn.microsoft.com/en-us/dotnet/csharp/async-and-await" },
            // --- DỮ LIỆU BỔ SUNG (NEW) ---
            { 
                id: 19, 
                title: "Lập trình Java: Collections Framework", 
                category: "Backend", 
                summary: "Sử dụng và phân biệt List, Set, Map, cùng với khái niệm Generic.", 
                content: "Java Collections Framework cung cấp một kiến trúc thống nhất để lưu trữ và thao tác với một nhóm các đối tượng. Các interface cốt lõi bao gồm List (danh sách có thứ tự), Set (tập hợp không trùng lặp), và Map (cặp key-value). Generic giúp đảm bảo an toàn kiểu dữ liệu (type-safe) tại thời điểm biên dịch.", 
                date: "2024-02-10", 
                author: "Java Dev", 
                link: "https://docs.oracle.com/javase/8/docs/technotes/guides/collections/overview.html" 
            },
            { 
                id: 20, 
                title: "Toán Rời rạc: Lý thuyết Đồ thị", 
                category: "General", 
                summary: "Các khái niệm cơ bản về đồ thị, đường đi, chu trình, và thuật toán tìm kiếm (BFS/DFS).", 
                content: "Lý thuyết đồ thị là xương sống của Khoa học máy tính. Đồ thị gồm các đỉnh (Vertices) và cạnh (Edges). Hai thuật toán duyệt đồ thị quan trọng nhất là Breadth-First Search (BFS - Tìm kiếm theo chiều rộng) và Depth-First Search (DFS - Tìm kiếm theo chiều sâu).", 
                date: "2024-02-12", 
                author: "Math Lover", 
                link: "https://www.tutorialspoint.com/discrete_mathematics/discrete_mathematics_graph_theory.htm" 
            },
            { 
                id: 21, 
                title: "Cơ sở Dữ liệu: Phân tách (Normalization)", 
                category: "Database", 
                summary: "Các dạng chuẩn (1NF, 2NF, 3NF, BCNF) để tối ưu hóa cấu trúc CSDL.", 
                content: "Chuẩn hóa (Normalization) là quá trình tổ chức dữ liệu để giảm thiểu trùng lặp (redundancy) và phụ thuộc không mong muốn. Thường chúng ta đưa CSDL về dạng chuẩn 3 (3NF) là đủ tốt cho hầu hết các ứng dụng thực tế.", 
                date: "2024-02-15", 
                author: "DBA", 
                link: "https://www.w3schools.com/sql/sql_normalization.asp" 
            },
            { 
                id: 22, 
                title: "Lập trình Mạng: Socket Programming", 
                category: "Backend", 
                summary: "Tạo kết nối Client-Server bằng TCP và UDP.", 
                content: "Socket là điểm cuối (endpoint) của một liên kết truyền thông hai chiều giữa hai chương trình chạy trên mạng. TCP cung cấp kết nối tin cậy (như gọi điện thoại), trong khi UDP nhanh hơn nhưng không đảm bảo thứ tự (như gửi thư).", 
                date: "2024-02-18", 
                author: "Net Admin", 
                link: "https://www.geeksforgeeks.org/socket-programming/" 
            },
            { 
                id: 23, 
                title: "Lý thuyết Mạng: Mô hình OSI và TCP/IP", 
                category: "DevOps", 
                summary: "Phân biệt các tầng (Layer) của mô hình OSI (7 tầng) và TCP/IP (4 tầng).", 
                content: "Mô hình OSI là mô hình tham chiếu lý thuyết gồm 7 tầng: Physical, Data Link, Network, Transport, Session, Presentation, Application. TCP/IP là mô hình thực tế đang chạy Internet ngày nay, gọn nhẹ hơn với 4 tầng.", 
                date: "2024-02-20", 
                author: "Net Admin", 
                link: "https://www.geeksforgeeks.org/layers-of-osi-model/" 
            },
            { 
                id: 24, 
                title: "Định tuyến (Routing)", 
                category: "DevOps", 
                summary: "Nguyên lý hoạt động của các giao thức định tuyến (RIP, OSPF, BGP).", 
                content: "Định tuyến là quá trình chọn đường đi tốt nhất cho gói tin trong mạng. Router sử dụng bảng định tuyến (Routing Table) được xây dựng bởi các giao thức như OSPF (nội vùng) hay BGP (liên vùng - xương sống của Internet).", 
                date: "2024-02-22", 
                author: "Net Admin", 
                link: "https://www.geeksforgeeks.org/routing-in-computer-network/" 
            }
        ];

        const categories = ["All", "Frontend", "Backend", "DevOps", "Database", "General"];

        // --- APP COMPONENT ---
        const App = () => {
            // [CẬP NHẬT] Khởi tạo state từ LocalStorage nếu có, nếu không thì dùng initialKnowledge
            const [knowledgeBase, setKnowledgeBase] = useState(() => {
                const savedData = localStorage.getItem('it-knowledge-data');
                if (savedData) {
                    try {
                        return JSON.parse(savedData);
                    } catch (e) {
                        return initialKnowledge;
                    }
                }
                return initialKnowledge;
            });

            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCategory, setSelectedCategory] = useState("All");
            const [isDarkMode, setIsDarkMode] = useState(() => {
                // Giữ chế độ Dark Mode khi reload
                return localStorage.getItem('theme') === 'dark';
            });
            const [selectedItem, setSelectedItem] = useState(null);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);

            // Form state
            const [newTitle, setNewTitle] = useState("");
            const [newCategory, setNewCategory] = useState("Frontend");
            const [newSummary, setNewSummary] = useState("");
            const [newContent, setNewContent] = useState("");
            const [newLink, setNewLink] = useState("");

            // [CẬP NHẬT] Tự động lưu vào LocalStorage mỗi khi knowledgeBase thay đổi
            useEffect(() => {
                localStorage.setItem('it-knowledge-data', JSON.stringify(knowledgeBase));
            }, [knowledgeBase]);

            // Xử lý Dark Mode và lưu vào LocalStorage
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [isDarkMode]);

            const toggleTheme = () => setIsDarkMode(!isDarkMode);

            // [TÍNH NĂNG MỚI] Khôi phục dữ liệu gốc
            const resetData = () => {
                if (confirm("Bạn có chắc muốn xóa hết bài viết mới và quay về dữ liệu gốc không?")) { // Đã sửa "Chủ nhân"
                    setKnowledgeBase(initialKnowledge);
                    localStorage.removeItem('it-knowledge-data');
                }
            };

            const filteredData = useMemo(() => knowledgeBase.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                    item.summary.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = selectedCategory === "All" || item.category === selectedCategory;
                return matchesSearch && matchesCategory;
            }), [knowledgeBase, searchTerm, selectedCategory]);

            const handleAddNew = (e) => {
                e.preventDefault();
                const newItem = {
                    id: Date.now(),
                    title: newTitle,
                    category: newCategory,
                    summary: newSummary,
                    content: newContent || newSummary,
                    date: new Date().toISOString().split('T')[0],
                    author: "Người dùng", // Đã sửa "Chủ nhân"
                    link: newLink || "#"
                };
                setKnowledgeBase([newItem, ...knowledgeBase]);
                setIsAddModalOpen(false);
                setNewTitle(""); setNewSummary(""); setNewContent(""); setNewLink("");
            };

            const handleDelete = (id, e) => {
                e.stopPropagation(); // Ngăn chặn mở modal xem chi tiết
                if(confirm("Bạn muốn xóa bài này thật ư?")) { // Đã sửa "Chủ nhân"
                    const updatedData = knowledgeBase.filter(item => item.id !== id);
                    setKnowledgeBase(updatedData);
                }
            }

            const getCategoryIcon = (cat) => {
                switch(cat) {
                    case 'Frontend': return <Icons.Layout className="w-4 h-4" />;
                    case 'Backend': return <Icons.Server className="w-4 h-4" />;
                    case 'Database': return <Icons.Database className="w-4 h-4" />;
                    case 'DevOps': return <Icons.Terminal className="w-4 h-4" />;
                    default: return <Icons.Code className="w-4 h-4" />;
                }
            };

            const getCategoryColor = (cat) => {
                switch(cat) {
                    case 'Frontend': return 'bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-200 border-blue-200 dark:border-blue-800';
                    case 'Backend': return 'bg-green-100 text-green-800 dark:bg-green-900/50 dark:text-green-200 border-green-200 dark:border-green-800';
                    case 'Database': return 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/50 dark:text-yellow-200 border-yellow-200 dark:border-yellow-800';
                    case 'DevOps': return 'bg-purple-100 text-purple-800 dark:bg-purple-900/50 dark:text-purple-200 border-purple-200 dark:border-purple-800';
                    default: return 'bg-gray-100 text-gray-800 dark:bg-gray-700/50 dark:text-gray-300 border-gray-200 dark:border-gray-700';
                }
            };

            return (
                <div className={`min-h-screen font-sans ${isDarkMode ? 'text-slate-100' : 'text-slate-800'}`}>
                    
                    {/* --- HEADER --- */}
                    <header className={`sticky top-0 z-20 glass border-b ${isDarkMode ? 'border-slate-700' : 'border-slate-200'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="p-2 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-lg text-white shadow-lg shadow-indigo-500/30">
                                    <Icons.Cpu className="w-6 h-6" />
                                </div>
                                <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent hidden sm:block">
                                    IT Knowledge Hub
                                </h1>
                            </div>

                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setIsAddModalOpen(true)}
                                    className="hidden sm:flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full text-sm font-medium transition-all hover:shadow-lg hover:shadow-indigo-500/20 active:scale-95"
                                >
                                    <Icons.Plus className="w-4 h-4" />
                                    <span>Thêm bài mới</span>
                                </button>
                                <button 
                                    onClick={resetData}
                                    className={`p-2 rounded-full transition-all duration-300 ${isDarkMode ? 'bg-slate-800 text-red-400 hover:bg-slate-700' : 'bg-white text-red-600 hover:bg-slate-100 shadow-sm border border-slate-200'}`}
                                    title="Khôi phục dữ liệu gốc"
                                >
                                    <Icons.Refresh className="w-5 h-5" />
                                </button>
                                <button 
                                    onClick={toggleTheme} 
                                    className={`p-2 rounded-full transition-all duration-300 ${isDarkMode ? 'bg-slate-800 text-yellow-400 hover:bg-slate-700' : 'bg-white text-slate-600 hover:bg-slate-100 shadow-sm border border-slate-200'}`}
                                    title="Chuyển chế độ sáng/tối"
                                >
                                    {isDarkMode ? <Icons.Sun className="w-5 h-5" /> : <Icons.Moon className="w-5 h-5" />}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        
                        {/* --- HERO & SEARCH --- */}
                        <div className="text-center mb-12 fade-in">
                            <h2 className="text-3xl sm:text-4xl font-extrabold mb-4 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 bg-clip-text text-transparent">
                                Khám phá kho tàng tri thức IT
                            </h2>
                            <p className={`text-lg mb-8 max-w-2xl mx-auto ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                                Tổng hợp tất cả kiến thức từ cơ bản đến nâng cao về lập trình, database, devops và nhiều hơn nữa.
                            </p>

                            <div className="relative max-w-2xl mx-auto mb-6 group">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <Icons.Search className={`w-5 h-5 ${isDarkMode ? 'text-slate-500' : 'text-slate-400'}`} />
                                </div>
                                <input
                                    type="text"
                                    placeholder="Tìm kiếm kiến thức (React, C++, SQL, LINQ...)"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className={`block w-full pl-11 pr-4 py-4 rounded-2xl border-2 focus:ring-0 focus:border-indigo-500 outline-none transition-all shadow-sm group-hover:shadow-md
                                        ${isDarkMode 
                                        ? 'bg-slate-800 border-slate-700 placeholder-slate-500 text-white' 
                                        : 'bg-white border-slate-200 placeholder-slate-400 text-slate-900'
                                        }`}
                                />
                            </div>

                            <div className="flex flex-wrap justify-center gap-2">
                                {categories.map((cat) => (
                                    <button
                                        key={cat}
                                        onClick={() => setSelectedCategory(cat)}
                                        className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-200 border
                                            ${selectedCategory === cat 
                                            ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' 
                                            : isDarkMode 
                                                ? 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700 hover:text-slate-200' 
                                                : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'
                                            }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* --- CONTENT GRID --- */}
                        {filteredData.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredData.map((item) => (
                                    <div 
                                        key={item.id}
                                        onClick={() => setSelectedItem(item)}
                                        className={`group relative rounded-2xl p-6 border transition-all duration-300 hover:shadow-xl hover:-translate-y-1 cursor-pointer overflow-hidden fade-in
                                            ${isDarkMode 
                                            ? 'bg-slate-800 border-slate-700 hover:border-indigo-500/50' 
                                            : 'bg-white border-slate-200 hover:border-indigo-300'
                                            }`}
                                    >
                                        <div className="flex items-start justify-between mb-4">
                                            <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border ${getCategoryColor(item.category)}`}>
                                                {getCategoryIcon(item.category)}
                                                {item.category}
                                            </span>
                                            {/* Nút xóa */}
                                            <button 
                                                onClick={(e) => handleDelete(item.id, e)}
                                                className={`opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded-full hover:bg-red-100 text-red-500`}
                                                title="Xóa bài viết"
                                            >
                                                <Icons.X className="w-4 h-4" />
                                            </button>
                                        </div>

                                        <h3 className={`text-lg font-bold mb-2 line-clamp-1 group-hover:text-indigo-500 transition-colors ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                                            {item.title}
                                        </h3>
                                        
                                        <p className={`text-sm mb-4 line-clamp-2 ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                                            {item.summary}
                                        </p>

                                        <div className="flex items-center justify-between mt-auto">
                                             <span className={`text-xs ${isDarkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                                                {item.date}
                                            </span>
                                            <div className="flex items-center gap-1 text-xs font-medium text-indigo-500 group-hover:translate-x-1 transition-transform">
                                                Xem ngay <Icons.ChevronRight className="w-3 h-3" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20 fade-in">
                                <div className={`mx-auto w-20 h-20 mb-6 rounded-full flex items-center justify-center ${isDarkMode ? 'bg-slate-800 text-slate-600' : 'bg-slate-100 text-slate-400'}`}>
                                    <Icons.Search className="w-10 h-10" />
                                </div>
                                <h3 className={`text-xl font-bold mb-2 ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>
                                    Không tìm thấy kiến thức nào
                                </h3>
                                <p className={`max-w-md mx-auto ${isDarkMode ? 'text-slate-500' : 'text-slate-500'}`}>
                                    Có vẻ như bạn đang tìm kiếm một bí thuật thất truyền? Hãy thử từ khóa khác xem sao ạ.
                                </p>
                            </div>
                        )}
                    </main>

                    {/* --- ADD NEW MODAL --- */}
                    {isAddModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className={`w-full max-w-lg rounded-2xl shadow-2xl p-6 relative ${isDarkMode ? 'bg-slate-800' : 'bg-white'}`}>
                                <button 
                                    onClick={() => setIsAddModalOpen(false)}
                                    className={`absolute top-4 right-4 p-1 rounded-full hover:bg-slate-100/10 transition-colors ${isDarkMode ? 'text-slate-400 hover:text-white' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    <Icons.X className="w-6 h-6" />
                                </button>
                                
                                <h2 className="text-2xl font-bold mb-6 flex items-center gap-2 text-indigo-500">
                                    <Icons.Plus className="w-6 h-6" /> Thêm kiến thức mới
                                </h2>

                                <form onSubmit={handleAddNew} className="space-y-4">
                                    <div>
                                        <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>Tiêu đề</label>
                                        <input required type="text" value={newTitle} onChange={e => setNewTitle(e.target.value)}
                                            className={`w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`} placeholder="Tiêu đề bài viết..." />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>Danh mục</label>
                                            <select value={newCategory} onChange={e => setNewCategory(e.target.value)}
                                                className={`w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`}>
                                                {categories.filter(c => c !== 'All').map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>Link tham khảo</label>
                                            <input type="text" value={newLink} onChange={e => setNewLink(e.target.value)}
                                                className={`w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`} placeholder="https://..." />
                                        </div>
                                    </div>

                                    <div>
                                        <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>Tóm tắt</label>
                                        <input required type="text" value={newSummary} onChange={e => setNewSummary(e.target.value)}
                                            className={`w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`} placeholder="Mô tả ngắn..." />
                                    </div>

                                    <div>
                                        <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>Nội dung chi tiết</label>
                                        <textarea required rows="4" value={newContent} onChange={e => setNewContent(e.target.value)}
                                            className={`w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'}`} placeholder="Nội dung chính..." />
                                    </div>

                                    <div className="pt-4 flex justify-end gap-3">
                                        <button type="button" onClick={() => setIsAddModalOpen(false)}
                                            className={`px-4 py-2 rounded-lg text-sm font-medium ${isDarkMode ? 'bg-slate-700 hover:bg-slate-600 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}>Hủy</button>
                                        <button type="submit" className="px-6 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-lg shadow-indigo-500/30 transform active:scale-95 transition-all">Lưu bài viết</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- READING MODAL --- */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className={`w-full max-w-2xl max-h-[85vh] overflow-hidden flex flex-col rounded-2xl shadow-2xl relative ${isDarkMode ? 'bg-slate-800' : 'bg-white'}`}>
                                
                                {/* Header */}
                                <div className={`px-6 py-4 border-b flex items-center justify-between z-10 ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                    <div className="flex items-center gap-3">
                                        <span className={`inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold border ${getCategoryColor(selectedItem.category)}`}>
                                            {getCategoryIcon(selectedItem.category)}
                                            {selectedItem.category}
                                        </span>
                                    </div>
                                    <button onClick={() => setSelectedItem(null)} className={`p-2 rounded-full transition-colors ${isDarkMode ? 'hover:bg-slate-700 text-slate-400' : 'hover:bg-slate-100 text-slate-500'}`}>
                                        <Icons.X className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* Content Scrollable */}
                                <div className="p-6 overflow-y-auto custom-scrollbar">
                                    <h1 className={`text-2xl sm:text-3xl font-bold mb-3 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                                        {selectedItem.title}
                                    </h1>
                                    
                                    <div className={`flex items-center gap-4 text-sm mb-8 ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                                        <span className="flex items-center gap-1"><Icons.Terminal className="w-3 h-3" /> {selectedItem.author}</span>
                                        <span>•</span>
                                        <span>{selectedItem.date}</span>
                                    </div>

                                    <div className={`prose max-w-none leading-relaxed text-lg ${isDarkMode ? 'prose-invert text-slate-300' : 'text-slate-700'}`}>
                                        <p className="whitespace-pre-wrap">{selectedItem.content}</p>
                                    </div>

                                    {selectedItem.link && selectedItem.link !== "#" && (
                                        <div className={`mt-8 p-4 rounded-xl border ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-indigo-50 border-indigo-100'}`}>
                                            <h4 className={`text-sm font-semibold mb-2 ${isDarkMode ? 'text-slate-300' : 'text-indigo-900'}`}>Nguồn tham khảo:</h4>
                                            <a href={selectedItem.link} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 text-indigo-500 hover:text-indigo-600 font-medium break-all">
                                                <Icons.ExternalLink className="w-4 h-4 flex-shrink-0" />
                                                {selectedItem.link}
                                            </a>
                                        </div>
                                    )}
                                </div>

                                {/* Footer */}
                                <div className={`px-6 py-4 border-t flex justify-end ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                    <button onClick={() => setSelectedItem(null)} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-indigo-500/20">
                                        Đóng
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Floating Action Button (Mobile) */}
                    <button 
                        onClick={() => setIsAddModalOpen(true)}
                        className="sm:hidden fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-90 transition-all z-40"
                    >
                        <Icons.Plus className="w-6 h-6" />
                    </button>

                    {/* Footer */}
                    <footer className={`mt-auto py-8 text-center text-sm border-t ${isDarkMode ? 'border-slate-800 bg-slate-900 text-slate-500' : 'border-slate-200 bg-slate-50 text-slate-400'}`}>
                        <p className="flex items-center justify-center gap-2">
                        <span className="text-red-500 animate-pulse"></span> BẢN THUỘC VỀ NGUYỄN SƠN KHIÊM 
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
